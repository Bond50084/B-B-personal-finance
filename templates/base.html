<!DOCTYPE html>
<html lang="en" class="h-100" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" />
    <meta
      name="author"
      content="Mark Otto, Jacob Thornton, and Bootstrap contributors"
    />
    <meta name="generator" content="Astro v5.9.2" />
    <title>{% block title %}Behrens & Behrens{% endblock %}</title>
    <link
      rel="canonical"
      href="https://getbootstrap.com/docs/5.3/examples/cover/"
    />

    <script src="{{ url_for('static', filename='assets/js/color-modes.js') }}"></script>

    <link
      href="{{ url_for('static', filename='assets/dist/css/bootstrap.min.css') }}"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#712cf9" />

    <link
      href="{{ url_for('static', filename='site/common_styles.css') }}"
      rel="stylesheet"
    />
    {% block head_extra %}{% endblock %}
  </head>

  <body
    class="d-flex text-center text-bg-dark {% block body_class %}{% endblock %}"
  >
    <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto">
        <div>
          <h3 class="float-md-start mb-0">
            <img
              src="{{ url_for('static', filename='assets/brand/logo-1.png') }}"
              alt="Behrens & Behrens"
              height="75"
              class="mx-1 rounded"
            />

            <img
              src="{{ url_for('static', filename='assets/brand/logo-2.png') }}"
              alt="Behrens & Behrens"
              height="75"
              class="mx-1 rounded"
            />
          </h3>
          <nav class="nav nav-masthead justify-content-center float-md-end">
            <a
              class="nav-link fw-bold py-1 px-0 {% if active_page == 'home' %}active{% endif %}"
              aria-current="page"
              href="{{ url_for('main_index') }}"
              >Home</a
            >

            <a
              class="nav-link fw-bold py-1 px-0 {% if active_page == 'simulator' %}active{% endif %}"
              href="{{ url_for('simulator_index') }}"
              >Simulator</a
            >

            <a class="nav-link fw-bold py-1 px-0" href="#">Products</a>

            <a class="nav-link fw-bold py-1 px-0" href="#">Contact</a>
          </nav>
        </div>
      </header>
      <main class="px-3">{% block content %}{% endblock %}</main>
      <footer class="mt-auto text-white-50">
        <p>
          © 2025 Behrens & Behrens<br />
          Caution, capital investments involve high risks.
        </p>
      </footer>
    </div>
    <script
      src="{{ url_for('static', filename='assets/dist/js/bootstrap.bundle.min.js') }}"
      class="astro-vvvwv3sm"
    ></script>
  </body>
</html>
